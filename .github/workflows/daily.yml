name: Daily AI Briefing

on:
  schedule:
    - cron: '30 0 * * *'   # UTC 00:30 = 北京时间每天 08:30
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write           # 允许部署 gh-pages 分支

jobs:
  briefing:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      REPORT_URL: https://suuurii.github.io/ai-news/report.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Summarize
        run: python scripts/summarize.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Render report
        run: python scripts/render_report.py

      - name: Prepare site
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp report.html _site/report.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true

      - name: Push to iPhone (Bark)
        run: python scripts/push_bark.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
