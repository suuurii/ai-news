name: Daily AI Briefing

on:
  schedule:
    - cron: '30 0 * * *'   # UTC 00:30 = 北京时间每天 08:30
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      REPORT_URL: https://suuurii.github.io/ai-news/report.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Summarize
        run: python scripts/summarize.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Render report
        run: python scripts/render_report.py

      - name: Prepare site
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp report.html _site/report.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push to iPhone (Bark)
        run: python scripts/push_bark.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
