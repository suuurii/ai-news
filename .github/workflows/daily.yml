name: Daily AI Briefing

on:
  schedule:
    - cron: '30 0 * * *'   # UTC 00:30 = 北京时间每天 08:30
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write           # 允许把日报提交回仓库

jobs:
  briefing:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      REPORT_URL: https://raw.githubusercontent.com/suuurii/ai-news/main/report.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Summarize
        run: python scripts/summarize.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Render report
        run: python scripts/render_report.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.html
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "日报：$(date +%Y-%m-%d)"
            git push
          fi

      - name: Push to iPhone (Bark)
        run: python scripts/push_bark.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
